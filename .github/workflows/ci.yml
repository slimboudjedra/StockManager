name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build StockManager/StockManager.csproj --configuration Release

      - name: Test
        run: dotnet test StockManager.Tests/StockManager.Tests.csproj --configuration Release